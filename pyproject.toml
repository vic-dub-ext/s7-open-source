[project]
name = "s7"
version = "0.1.0"
description = "The data is in the supplement. An open-source pipeline that extracts human genetic association results from the supplementary files of genetics papers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Dubeux" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "openpyxl>=3.1",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "extend-ai>=1.17",
    "anthropic>=0.120.2",
    "openai>=2.53.0",
]

[project.urls]
Repository = "https://github.com/vic-dub-ext/s7-open-source"

[project.scripts]
s7 = "s7.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# No type stubs published for pyarrow as of 2026-08 (unlike openpyxl, which
# has types-openpyxl in [dev]). Scoped to just this module, not a blanket
# relaxation.
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
